name: trip
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.2 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  camera: ^0.11.1
  audioplayers: ^6.4.0
  http: ^1.1.0
  csv: ^6.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  lottie: ^3.3.1
  sms_autofill: ^2.4.1
  pin_code_fields: ^8.0.1
  shared_preferences: ^2.2.1
  url_launcher: ^6.1.14
  google_sign_in: ^6.1.6
  flutter_email_sender: ^7.0.0
  icons_plus: ^5.0.0
  curved_navigation_bar: ^1.0.3
  flutter_settings_screens: ^0.3.2
  awesome_dialog: ^3.2.1
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  intl: ^0.20.2
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.4
  firebase_storage: ^12.4.5
  google_maps_flutter: ^2.5.0
  dartz: ^0.10.1
  sign_in_with_apple: ^7.0.1
  geolocator: ^14.0.0
  font_awesome_flutter: ^10.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:

  uses-material-design: true
  assets:
    - assets/images/
    - assets/animation/
    - assets/icons/
    - assets/notifications/
  fonts:
    - family: Neo Sans Arabic
      fonts:
        - asset: assets/fonts/NeoSansArabic.ttf
    - family: Cadillac Sans Arabic Medium
      fonts:
        - asset: assets/fonts/Cadillac-Sans-Arabic-Medium.ttf